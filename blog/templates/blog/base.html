<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>{% block title %}Django Multiuser Blog{% endblock %}</title><style>body{font-family:system-ui;margin:0;background:#f6f7fb;color:#172033}nav{background:#172033;color:white;padding:16px 5%;display:flex;gap:18px;align-items:center}nav a{color:white;text-decoration:none}.wrap{max-width:900px;margin:35px auto;padding:0 18px}.card{background:white;padding:22px;border-radius:14px;margin:16px 0;box-shadow:0 3px 15px #0001}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:7px 0 14px;border:1px solid #ccd3df;border-radius:8px}button,.btn{background:#172033;color:white;border:0;padding:10px 15px;border-radius:8px;text-decoration:none;display:inline-block}.muted{color:#687386}.tag{display:inline-block;background:#eef2ff;padding:4px 8px;border-radius:999px;margin:3px;font-size:.85rem}.messages{padding:0}.messages li{background:#e8f7ed;padding:10px;border-radius:8px;list-style:none}</style></head><body><nav><a href='/'><strong>Blog</strong></a><a href='/feed/'>RSS</a>{% if user.is_authenticated %}<a href='/posts/new/'>Write</a><span style='margin-left:auto'>Hi, {{user.username}}</span><form method='post' action='/accounts/logout/' style='margin:0'>{% csrf_token %}<button>Logout</button></form>{% else %}<span style='margin-left:auto'><a href='/accounts/login/'>Login</a> · <a href='/accounts/register/'>Register</a></span>{% endif %}</nav><main class='wrap'>{% if messages %}<ul class='messages'>{% for message in messages %}<li>{{message}}</li>{% endfor %}</ul>{% endif %}{% block content %}{% endblock %}</main></body></html>
